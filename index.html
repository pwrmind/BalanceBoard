<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Матрица Баланса – Material UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --md-primary: #6750A4;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EADDFF;
            --md-on-primary-container: #21005D;
            --md-surface: #FEF7FF;
            --md-on-surface: #1D1B20;
            --md-surface-variant: #E7E0EC;
            --md-on-surface-variant: #49454F;
            --md-outline: #79747E;
            --md-error: #B3261E;
            --md-error-container: #F9DEDC;
            --md-on-error-container: #410E0B;
            --md-warning: #8B6508;
            --md-warning-container: #FFDF9E;
            --md-on-warning-container: #2D1F00;
            --md-success: #146C36;
            --md-success-container: #C6F2D4;
            --md-on-success-container: #00210B;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #F3EDF7;
            color: var(--md-on-surface);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        #app {
            width: 100%;
            max-width: 640px;
            background: var(--md-surface);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 1px 3px 1px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        @media (max-width: 480px) {
            body { padding: 8px; }
            #app { padding: 16px; border-radius: 16px; }
        }
    </style>
</head>
<body>
<div id="app">
    <app-root></app-root>
</div>

<script>
const DEFAULT_SPHERES = [
    'Здоровье и спорт', 'Карьера и бизнес', 'Финансы',
    'Окружение и друзья', 'Семья и отношения',
    'Личностный рост', 'Яркость жизни', 'Духовность'
];

window.AppState = {
    currentStep: 0,
    snapshots: {
        1: [...DEFAULT_SPHERES],
        2: [...DEFAULT_SPHERES],
        3: [...DEFAULT_SPHERES],
        4: [...DEFAULT_SPHERES]
    },
    titles: {
        1: "Приоритет: КАК СЕЙЧАС",
        2: "Приоритет: КАК ХОЧУ",
        3: "Время и внимание: КАК СЕЙЧАС",
        4: "Время и внимание: КАК ХОЧУ"
    },
    subtitles: {
        1: "Самое важное сейчас — наверху.",
        2: "Идеальный приоритет в вашем представлении.",
        3: "Куда уходит больше всего мыслей и сил.",
        4: "Сколько времени вы хотите уделять каждой сфере."
    },

    calculateGINS(snapshots) {
        let total = 0;
        DEFAULT_SPHERES.forEach(name => {
            const pNow = 10 - snapshots[1].indexOf(name);
            const pWant = 10 - snapshots[2].indexOf(name);
            const tNow = 10 - snapshots[3].indexOf(name);
            const tWant = 10 - snapshots[4].indexOf(name);
            total += Math.abs((pNow - pWant) * (tNow - tWant));
        });
        return total;
    },

    moveStep(direction) {
        const next = this.currentStep + direction;
        if (next >= 0 && next <= 6) {
            if (direction === 1 && next >= 1 && next <= 4 &&
                JSON.stringify(this.snapshots[next]) === JSON.stringify(DEFAULT_SPHERES)) {
                this.snapshots[next] = [...this.snapshots[this.currentStep === 0 ? 1 : this.currentStep]];
            }
            this.currentStep = next;
            window.dispatchEvent(new CustomEvent('state-changed'));
        }
    },

    updateSnapshot(step, newList) { this.snapshots[step] = newList; },

    getHistory() {
        return JSON.parse(localStorage.getItem('balance_4d_history') || '[]');
    },
    saveCurrentSession() {
        const history = this.getHistory();
        history.unshift({
            id: Date.now(),
            date: new Date().toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }),
            snapshots: JSON.parse(JSON.stringify(this.snapshots))
        });
        localStorage.setItem('balance_4d_history', JSON.stringify(history));
    },
    deleteSession(id) {
        let history = this.getHistory().filter(s => s.id !== id);
        localStorage.setItem('balance_4d_history', JSON.stringify(history));
        window.dispatchEvent(new CustomEvent('state-changed'));
    },
    reset() {
        this.currentStep = 0;
        this.snapshots = {
            1: [...DEFAULT_SPHERES], 2: [...DEFAULT_SPHERES],
            3: [...DEFAULT_SPHERES], 4: [...DEFAULT_SPHERES]
        };
        window.dispatchEvent(new CustomEvent('state-changed'));
    }
};

// ---------- balance-list (Material UI) ----------
class BalanceList extends HTMLElement {
    constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.draggedIndex = null;
        this.touchDraggedItem = null;
        this.touchStartY = 0;
        this.selectedIndex = null;
        this.touchMoved = false;
    }
    connectedCallback() { this.render(); }
    static get observedAttributes() { return ['step']; }
    attributeChangedCallback() { this.render(); }

    render() {
        const step = parseInt(this.getAttribute('step'));
        const items = window.AppState.snapshots[step] || DEFAULT_SPHERES;
        this.shadowRoot.innerHTML = `
            <style>
                :host { display: block; width: 100%; }
                .container { display: grid; gap: 12px; margin: 16px 0; }
                .scale { display: flex; flex-direction: column; gap: 8px; }
                .static-badge {
                    background: var(--md-surface-variant);
                    color: var(--md-on-surface-variant);
                    border-radius: 8px; font-size: 12px; font-weight: 700;
                    min-width: 72px; height: 56px; display: flex; align-items: center;
                    justify-content: center; box-sizing: border-box;
                }
                .list { display: flex; flex-direction: column; gap: 8px; position: relative; }
                .item-wrapper { position: relative; height: 56px; }
                .item {
                    padding: 0 16px; background: #fff; border: 1px solid var(--md-outline);
                    border-radius: 12px; cursor: grab; user-select: none;
                    display: flex; align-items: center; justify-content: space-between;
                    color: var(--md-on-surface); height: 100%; box-sizing: border-box;
                    touch-action: none; transition: background .2s, box-shadow .2s;
                }
                .item:hover { background: rgba(103,80,164,0.04); }
                .item.dragging { opacity: 0.4; background: var(--md-surface-variant); }
                .item.selected {
                    background: rgba(103,80,164,0.12); border-color: var(--md-primary);
                    border-width: 2px;
                }
                .name { font-size: 15px; font-weight: 500; }
                .drag-handle { color: var(--md-on-surface-variant); }
                .material-icons { font-family: 'Material Icons'; font-size: 22px; }
                .drop-indicator {
                    position: absolute; left: 0; right: 0; height: 4px;
                    background: var(--md-primary); border-radius: 2px;
                    display: none; pointer-events: none; z-index: 10;
                }
                .item-wrapper.drag-before .drop-indicator.top { display: block; top: -6px; }
                .item-wrapper.drag-after .drop-indicator.bottom { display: block; bottom: -6px; }
                @media (max-width: 480px) {
                    .static-badge { min-width: 60px; font-size: 11px; }
                    .name { font-size: 14px; }
                }
            </style>
            <div class="container">
                <div class="list">
                    ${items.map((name, idx) => `
                        <div class="item-wrapper" data-index="${idx}">
                            <div class="drop-indicator top"></div>
                            <div class="item" draggable="true">
                                <span class="name">${name}</span>
                                <span class="drag-handle material-icons">drag_indicator</span>
                            </div>
                            <div class="drop-indicator bottom"></div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        this.setupDesktopDragAndDrop();
        this.setupMobileTouchAndClick();
    }

    setupDesktopDragAndDrop() {
        const wrappers = this.shadowRoot.querySelectorAll('.item-wrapper');
        let dropPosition = null;
        wrappers.forEach(wrapper => {
            const item = wrapper.querySelector('.item');
            item.addEventListener('dragstart', (e) => {
                this.draggedIndex = parseInt(wrapper.dataset.index);
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });
            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
                this.clearIndicators();
            });
            wrapper.addEventListener('dragover', (e) => {
                e.preventDefault();
                const rect = wrapper.getBoundingClientRect();
                this.clearIndicators();
                if ((e.clientY - rect.top) < rect.height/2) {
                    wrapper.classList.add('drag-before'); dropPosition = 'before';
                } else {
                    wrapper.classList.add('drag-after'); dropPosition = 'after';
                }
            });
            wrapper.addEventListener('dragleave', () => this.clearIndicators());
            wrapper.addEventListener('drop', (e) => {
                e.preventDefault();
                this.executeReorder(parseInt(wrapper.dataset.index), dropPosition);
            });
        });
    }

    setupMobileTouchAndClick() {
        const wrappers = this.shadowRoot.querySelectorAll('.item-wrapper');
        let dropPosition = null, lastTargetWrapper = null;
        wrappers.forEach(wrapper => {
            const item = wrapper.querySelector('.item');
            item.addEventListener('click', (e) => {
                if (this.touchMoved) { this.touchMoved = false; return; }
                const idx = parseInt(wrapper.dataset.index);
                if (this.selectedIndex === null) {
                    this.selectedIndex = idx; item.classList.add('selected');
                } else {
                    if (this.selectedIndex !== idx) {
                        this.draggedIndex = this.selectedIndex;
                        this.executeReorder(idx, 'before');
                    }
                    this.selectedIndex = null;
                    this.shadowRoot.querySelectorAll('.item').forEach(i => i.classList.remove('selected'));
                }
            });
            item.addEventListener('touchstart', (e) => {
                this.draggedIndex = parseInt(wrapper.dataset.index);
                this.touchDraggedItem = item;
                this.touchStartY = e.touches[0].clientY;
                this.touchMoved = false;
                item.style.position = 'relative'; item.style.zIndex = '100';
            });
            item.addEventListener('touchmove', (e) => {
                if (!this.touchDraggedItem) return;
                this.touchMoved = true;
                const currentY = e.touches[0].clientY;
                this.touchDraggedItem.style.transform = `translateY(${currentY - this.touchStartY}px)`;
                this.touchDraggedItem.style.pointerEvents = 'none';
                this.clearIndicators();
                const targetEl = this.shadowRoot.elementFromPoint(e.touches[0].clientX, currentY);
                this.touchDraggedItem.style.pointerEvents = '';
                const curW = targetEl?.closest('.item-wrapper');
                if (curW) {
                    lastTargetWrapper = curW;
                    const rect = curW.getBoundingClientRect();
                    if ((currentY - rect.top) < rect.height/2) {
                        curW.classList.add('drag-before'); dropPosition = 'before';
                    } else {
                        curW.classList.add('drag-after'); dropPosition = 'after';
                    }
                }
            });
            item.addEventListener('touchend', () => {
                if (!this.touchDraggedItem) return;
                this.touchDraggedItem.style.transform = '';
                this.touchDraggedItem.style.position = '';
                this.touchDraggedItem.style.zIndex = '';
                this.clearIndicators();
                if (lastTargetWrapper && this.draggedIndex !== null && this.touchMoved) {
                    this.executeReorder(parseInt(lastTargetWrapper.dataset.index), dropPosition);
                }
                this.touchDraggedItem = null;
                this.draggedIndex = null;
                lastTargetWrapper = null;
            });
        });
    }

    executeReorder(targetIndex, position) {
        if (this.draggedIndex === null || this.draggedIndex === targetIndex) return;
        const step = parseInt(this.getAttribute('step'));
        const list = [...window.AppState.snapshots[step]];
        const [moved] = list.splice(this.draggedIndex, 1);
        let newIdx = targetIndex;
        if (position === 'after' && this.draggedIndex > targetIndex) newIdx = targetIndex + 1;
        else if (position === 'before' && this.draggedIndex < targetIndex) newIdx = targetIndex - 1;
        if (newIdx < 0) newIdx = 0;
        list.splice(newIdx, 0, moved);
        window.AppState.updateSnapshot(step, list);
        this.render();
        this.draggedIndex = null;
    }

    clearIndicators() {
        this.shadowRoot.querySelectorAll('.item-wrapper').forEach(w => w.classList.remove('drag-before','drag-after'));
    }
}
customElements.define('balance-list', BalanceList);

// ---------- balance-dashboard (MUI) ----------
class BalanceDashboard extends HTMLElement {
    constructor() {
        super();
        this.attachShadow({ mode: 'open' });
    }
    connectedCallback() { this.calculateMetrics(); }
    calculateMetrics() {
        const sn = window.AppState.snapshots;
        const metrics = DEFAULT_SPHERES.map(name => {
            const pN = 10 - sn[1].indexOf(name), pW = 10 - sn[2].indexOf(name);
            const tN = 10 - sn[3].indexOf(name), tW = 10 - sn[4].indexOf(name);
            return { name, pN, pW, tN, tW, ird: (pN-pW)*(tN-tW) };
        });
        const v = metrics.filter(m => m.tN > m.tW && m.pN > m.pW);
        const s = metrics.filter(m => (m.ird < 0) || (m.tN < m.tW && m.pN > m.pW));
        const h = metrics.filter(m => !v.includes(m) && !s.includes(m));
        this.render(v,s,h);
    }
    render(v,s,h) {
        const ins = {
            v: "Психика использует эту сферу как «кредитную карту» — вы берете отсюда энергию в долг, чтобы заглушить тревогу.",
            s: "Внутренний конфликт: сфера важна, но мозг блокирует действия, боясь неудачи."
        };
        this.shadowRoot.innerHTML = `
            <style>
                :host { display: block; }
                h2 { font-size: 1.3rem; font-weight: 500; margin-bottom: 16px; }
                .card { padding: 16px; border-radius: 16px; margin-bottom: 16px; }
                .v { background: var(--md-error-container); color: var(--md-on-error-container); }
                .s { background: var(--md-warning-container); color: var(--md-on-warning-container); }
                .h { background: var(--md-success-container); color: var(--md-on-success-container); }
                .title { font-weight: 700; margin-bottom: 8px; }
                .chip { display: inline-block; background: rgba(0,0,0,0.08); padding: 4px 10px; border-radius: 8px; margin: 3px; font-size: 13px; }
                .insight { font-style: italic; margin: 8px 0; font-size: 14px; }
                ul { margin: 0; padding-left: 20px; }
                li { margin-bottom: 6px; }
                .mvp { background: rgba(255,255,255,0.7); border-radius: 8px; padding: 8px; margin-top: 8px; font-size: 13px; }
            </style>
            <h2>🎯 Результаты диагностики</h2>
            <div class="card v"><div class="title">🔴 Зона насилия</div>
                ${v.length ? v.map(m=>`<span class="chip">${m.name} (ИРД: +${m.ird})</span>`).join('') : 'Отсутствует.'}
                ${v.map(m => `<div class="insight">${ins.v}</div><ul><li>Что заставляет удерживать высокую важность?</li><li>Как снизить контроль на 10%?</li></ul><div class="mvp">🏃 Эксперимент: уменьшить время на контроль на 10%.</div>`).join('')}
            </div>
            <div class="card s"><div class="title">🟡 Зона саботажа</div>
                ${s.length ? s.map(m=>`<span class="chip">${m.name}</span>`).join('') : 'Отсутствует.'}
                ${s.map(m => `<div class="insight">${ins.s}</div><ul><li>Какая мысль возникает перед действием?</li><li>Какое неидеальное действие можно сделать сегодня?</li></ul><div class="mvp">🛠 Сделайте сверхмалый шаг прямо сейчас.</div>`).join('')}
            </div>
            <div class="card h"><div class="title">🟢 Системное здоровье</div>
                ${h.length ? h.map(m=>`<span class="chip">${m.name}</span>`).join('') : 'Пока нет сбалансированных сфер.'}
            </div>
        `;
    }
}
customElements.define('balance-dashboard', BalanceDashboard);

// ---------- balance-history (MUI) ----------
class BalanceHistory extends HTMLElement {
    constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.selectedId = null;
    }
    connectedCallback() { this.render(); }
    getMetrics(sn) {
        return DEFAULT_SPHERES.map(name => ({
            name,
            ird: (10-sn[1].indexOf(name) - (10-sn[2].indexOf(name))) * ((10-sn[3].indexOf(name)) - (10-sn[4].indexOf(name)))
        }));
    }
    render() {
        const hist = window.AppState.getHistory();
        if (!hist.length) {
            this.shadowRoot.innerHTML = `<div style="text-align:center; padding:40px;">История пуста.</div>`;
            return;
        }
        if (!this.selectedId) this.selectedId = hist[0].id;
        const cur = this.getMetrics(window.AppState.snapshots);
        const pastSes = hist.find(s => s.id === this.selectedId) || hist[0];
        const past = this.getMetrics(pastSes.snapshots);
        this.shadowRoot.innerHTML = `
            <style>
                :host { display: block; }
                h2 { font-size: 1.2rem; margin-bottom: 12px; }
                .select-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
                select { flex:1; padding: 8px; border-radius: 8px; border: 1px solid var(--md-outline); }
                button { background: none; border: none; color: var(--md-error); text-decoration: underline; cursor: pointer; }
                table { width: 100%; border-collapse: collapse; }
                th, td { padding: 8px; border-bottom: 1px solid var(--md-surface-variant); text-align: left; }
                .trend { font-weight: bold; padding: 2px 6px; border-radius: 4px; }
                .up { background: #C6F2D4; color: #146C36; }
                .down { background: #F9DEDC; color: #B3261E; }
            </style>
            <h2>📜 Сравнение истории</h2>
            <div class="select-row">
                <select id="sel">${hist.map(s => `<option value="${s.id}" ${s.id===this.selectedId?'selected':''}>${s.date}</option>`).join('')}</select>
                <button id="del">Удалить</button>
            </div>
            <table>
                <tr><th>Сфера</th><th>Было</th><th>Стало</th><th>Тренд</th></tr>
                ${cur.map((c,i) => {
                    const p = past[i]?.ird || 0;
                    const d = c.ird - p;
                    let cls = '', txt = '—';
                    if (d>0) { cls='down'; txt=`+${d} 🔺`; }
                    else if (d<0) { cls='up'; txt=`${d} 🔻`; }
                    return `<tr><td>${c.name}</td><td>${p>=0?'+':''}${p}</td><td>${c.ird>=0?'+':''}${c.ird}</td><td><span class="trend ${cls}">${txt}</span></td></tr>`;
                }).join('')}
            </table>
        `;
        this.shadowRoot.querySelector('#sel').addEventListener('change', e => {
            this.selectedId = +e.target.value;
            this.render();
        });
        this.shadowRoot.querySelector('#del').addEventListener('click', () => {
            if (confirm('Удалить запись?')) {
                window.AppState.deleteSession(this.selectedId);
                this.selectedId = null;
                this.render();
            }
        });
    }
}
customElements.define('balance-history', BalanceHistory);

// ---------- app-root (Material Design 3) ----------
class AppRoot extends HTMLElement {
    constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        window.addEventListener('state-changed', () => this.render());
    }
    connectedCallback() { this.render(); }

    render() {
        const step = window.AppState.currentStep;
        if (step === 0) return this.renderHome();

        const title = step<5 ? window.AppState.titles[step] : (step===5 ? 'Результаты' : 'История');
        const sub = step<5 ? window.AppState.subtitles[step] : '';
        this.shadowRoot.innerHTML = `
            <style>
                .header { margin-bottom: 8px; }
                .title { font-size: 1.2rem; font-weight: 500; }
                .sub { font-size: 0.9rem; color: var(--md-on-surface-variant); margin-bottom: 8px; }
                .nav { display: flex; justify-content: space-between; margin-top: 20px; gap: 8px; }
                button {
                    border: none; border-radius: 20px; padding: 10px 24px;
                    font-weight: 600; font-size: 14px; cursor: pointer;
                    transition: background .2s; letter-spacing: 0.5px;
                }
                .btn-outlined { background: transparent; border: 1px solid var(--md-outline); color: var(--md-primary); }
                .btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
                button:disabled { opacity: 0.5; }
            </style>
            <div class="header">
                <div class="title">${title}</div>
                <div class="sub">${sub}</div>
            </div>
            ${step<5 ? `<balance-list step="${step}"></balance-list>` : ''}
            ${step===5 ? '<balance-dashboard></balance-dashboard>' : ''}
            ${step===6 ? '<balance-history></balance-history>' : ''}
            <div class="nav">
                <button class="btn-outlined" id="home-btn">🏠 Меню</button>
                <button class="btn-outlined" id="back-btn" ${step===1?'disabled':''}>← Назад</button>
                <button class="btn-filled" id="next-btn">
                    ${step===4 ? '📊 Результат' : step===5 ? '💾 Сохранить' : step===6 ? '🔄 Заново' : 'Далее →'}
                </button>
            </div>
        `;
        this.setupNav();
    }

    renderHome() {
        const hist = window.AppState.getHistory();
        let gins = '--', status = 'Не откалибровано', cls = 'empty', trend='';
        if (hist.length) {
            const curGins = window.AppState.calculateGINS(hist[0].snapshots);
            gins = curGins;
            if (curGins<=15) { cls='green'; status='Декомпрессия'; }
            else if (curGins<=45) { cls='yellow'; status='Напряжение'; }
            else { cls='red'; status='Критическое выгорание'; }
            if (hist.length>1) {
                const prev = window.AppState.calculateGINS(hist[1].snapshots);
                const diff = curGins - prev;
                if (diff<0) trend = `📉 Снижение на ${Math.abs(diff)} б.`;
                else if (diff>0) trend = `🔺 Рост на ${diff} б.`;
                else trend = '⚖️ Без изменений';
            }
        }
        this.shadowRoot.innerHTML = `
            <style>
                .home { text-align: center; }
                h1 { font-size: 1.5rem; font-weight: 500; }
                .gins-card {
                    margin: 20px 0; padding: 24px; border-radius: 24px;
                    background: var(--md-surface); border: 1px solid var(--md-surface-variant);
                }
                .gins-card.green { background: var(--md-success-container); color: var(--md-on-success-container); }
                .gins-card.yellow { background: var(--md-warning-container); color: var(--md-on-warning-container); }
                .gins-card.red { background: var(--md-error-container); color: var(--md-on-error-container); }
                .gins-val { font-size: 3rem; font-weight: 700; }
                .gins-lab { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
                .trend { margin: 8px 0; font-size: 0.9rem; }
                .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
                button {
                    border: none; border-radius: 20px; padding: 14px;
                    font-weight: 600; font-size: 15px; cursor: pointer;
                }
                .btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
                .btn-outlined { background: transparent; border: 1px solid var(--md-outline); color: var(--md-primary); }
            </style>
            <div class="home">
                <h1>4D Матрица Баланса</h1>
                <div class="gins-card ${cls}">
                    <div class="gins-lab">Глобальный индекс напряжения</div>
                    <div class="gins-val">${gins}</div>
                    <div>${status}</div>
                    ${trend ? `<div class="trend">${trend}</div>` : ''}
                </div>
                <div class="actions">
                    <button class="btn-filled" id="start">🚀 Новая диагностика</button>
                    <button class="btn-outlined" id="history" ${!hist.length?'disabled':''}>📂 Архив</button>
                </div>
            </div>
        `;
        this.shadowRoot.querySelector('#start')?.addEventListener('click', () => window.AppState.moveStep(1));
        this.shadowRoot.querySelector('#history')?.addEventListener('click', () => {
            window.AppState.currentStep = 6;
            window.dispatchEvent(new CustomEvent('state-changed'));
        });
    }

    setupNav() {
        this.shadowRoot.querySelector('#home-btn')?.addEventListener('click', () => window.AppState.reset());
        this.shadowRoot.querySelector('#back-btn')?.addEventListener('click', () => window.AppState.moveStep(-1));
        this.shadowRoot.querySelector('#next-btn')?.addEventListener('click', () => {
            const step = window.AppState.currentStep;
            if (step === 5) {
                window.AppState.saveCurrentSession();
                window.AppState.currentStep = 6;
                window.dispatchEvent(new CustomEvent('state-changed'));
            } else if (step === 6) {
                window.AppState.reset();
            } else {
                window.AppState.moveStep(1);
            }
        });
    }
}
customElements.define('app-root', AppRoot);
</script>
</body>
</html>
